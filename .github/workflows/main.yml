name: Weekly testRigor Suite Run

on:
  schedule:
    - cron: "45 8 * * 2" # 8:45 AM UTC = 2:15 PM IST on Tuesdays
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  trigger-testrigor-suite:
    runs-on: ubuntu-latest
    steps:
      - name: "Trigger and Wait for testRigor Suite"
        env:
          TESTRIGOR_AUTH_TOKEN: ${{ secrets.TESTRIGOR_AUTH_TOKEN }}
          TESTRIGOR_APP_ID: ${{ secrets.TESTRIGOR_APP_ID }}
        run: |
          #!/bin/bash
          
          curl -X POST \
            -H 'Content-type: application/json' \
            -H "auth-token: ${TESTRIGOR_AUTH_TOKEN}" \
            --data '{"forceCancelPreviousTesting":true,"storedValues":{"storedValueName1":"Value"}}' \
            "https://api.testrigor.com/api/v1/apps/${TESTRIGOR_APP_ID}/retest"
          
          sleep 10
          
          while true
          do
            echo " "
            echo "==================================="
            echo " Checking run status"
            echo "==================================="
            response=$(curl -i -o - -s -X GET "https://api.testrigor.com/api/v1/apps/${TESTRIGOR_APP_ID}/status" -H "auth-token: ${TESTRIGOR_AUTH_TOKEN}" -H 'Accept: application/json')
            code=$(echo "$response" | grep HTTP | awk '{print $2}')
            body=$(echo "$response" | sed -n '/{/,/}/p')
            
            echo "Status code: " $code
            echo "Response: " $body
            
            case $code in
              4*|5*)
                # 400 or 500 errors
                echo "Error calling API"
                exit 1
                ;;
              200)
                # 200: successfully finished
                echo "Test finished successfully"
                exit 0
                ;;
              227|228)
                # 227: New - 228: In progress
                echo "Test is not finished yet"
                ;;
              229)
                # 229: Canceled
                echo "Test canceled"
                exit 1
                ;;
              230)
                # 230: Failed
                echo "Test finished but failed"
                exit 1
                ;;
              *)
                echo "Unknown status"
                exit 1
            esac
            sleep 10
          done
